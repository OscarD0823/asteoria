appId: com.oscard.asteorialore
productName: Asteoria Lore
directories:
  output: release-stories
extraMetadata:
  name: asteoria-stories
  version: 1.1.0
  prismaProduct: stories
fileAssociations: [{"ext":"lore","mimeType":"application/x-asteoria-lore","name":"Asteoria Lore · .lore","role":"Editor"}]
files:
  - dist-stories/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - file-formats.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/stories-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Asteoria-Lore-${version}-Windows-Setup.exe
