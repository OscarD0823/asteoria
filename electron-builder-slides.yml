appId: com.oscard.prismaslides
productName: Asteoria Nova
directories:
  output: release-slides
extraMetadata:
  name: asteoria-slides
  version: 1.0.2
  prismaProduct: slides
fileAssociations: [{"ext":"pptx","mimeType":"application/vnd.openxmlformats-officedocument.presentationml.presentation","name":"Asteoria Nova · .pptx","role":"Editor"},{"ext":"pptm","mimeType":"application/vnd.ms-powerpoint.presentation.macroEnabled.12","name":"Asteoria Nova · .pptm","role":"Editor"}]
files:
  - dist-slides/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - file-formats.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/slides-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Asteoria-Nova-${version}-Windows-Setup.exe
