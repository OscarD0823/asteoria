appId: com.oscard.prismaslides
productName: Asteoria Nova
directories:
  output: release-slides
extraMetadata:
  name: asteoria-slides
  version: 1.0.1
  prismaProduct: slides
files:
  - dist-slides/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/slides-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Asteoria-Nova-${version}-Windows-Setup.exe
