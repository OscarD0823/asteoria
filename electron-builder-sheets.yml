appId: com.oscard.prismasheets
productName: Asteoria Orbit
directories:
  output: release-sheets
extraMetadata:
  name: asteoria-sheets
  version: 1.0.2
  prismaProduct: sheets
fileAssociations: [{"ext":"xlsx","mimeType":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","name":"Asteoria Orbit · .xlsx","role":"Editor"},{"ext":"xlsm","mimeType":"application/vnd.ms-excel.sheet.macroEnabled.12","name":"Asteoria Orbit · .xlsm","role":"Editor"},{"ext":"csv","mimeType":"text/csv","name":"Asteoria Orbit · .csv","role":"Editor"},{"ext":"tsv","mimeType":"text/tab-separated-values","name":"Asteoria Orbit · .tsv","role":"Editor"}]
files:
  - dist-sheets/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - file-formats.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/sheets-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Asteoria-Orbit-${version}-Windows-Setup.exe
