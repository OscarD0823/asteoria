appId: com.oscard.prismasheets
productName: Asteoria Orbit
directories:
  output: release-sheets
extraMetadata:
  name: asteoria-sheets
  version: 1.0.1
  prismaProduct: sheets
files:
  - dist-sheets/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/sheets-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Asteoria-Orbit-${version}-Windows-Setup.exe
