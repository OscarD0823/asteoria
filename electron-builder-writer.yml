appId: com.oscard.prismawriter
productName: Asteoria Scribe
directories:
  output: release-writer
extraMetadata:
  name: asteoria-writer
  version: 2.0.0
  prismaProduct: writer
files:
  - dist-writer/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/writer-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Asteoria-Scribe-${version}-Windows-Setup.exe
