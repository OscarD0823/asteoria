appId: com.oscard.prismawriter
productName: Auralis Scribe
directories:
  output: release-writer
extraMetadata:
  name: asteoria-writer
  version: 3.0.0
  prismaProduct: writer
fileAssociations: [{"ext":"auralis","mimeType":"application/x-auralis-scribe","name":"Auralis Scribe · .auralis","role":"Editor"},{"ext":"docx","mimeType":"application/vnd.openxmlformats-officedocument.wordprocessingml.document","name":"Auralis Scribe · .docx","role":"Editor"},{"ext":"docm","mimeType":"application/vnd.ms-word.document.macroEnabled.12","name":"Auralis Scribe · .docm","role":"Editor"},{"ext":"txt","mimeType":"text/plain","name":"Auralis Scribe · .txt","role":"Editor"},{"ext":"prisma","mimeType":"application/x-asteoria-scribe","name":"Auralis Scribe · .prisma","role":"Editor"}]
files:
  - dist-writer/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - file-formats.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/writer-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Auralis-Scribe-${version}-Windows-Setup.exe
