appId: com.oscard.prismadata
productName: Auralis Nexus
directories:
  output: release-data
extraMetadata:
  name: asteoria-data
  version: 2.0.0
  prismaProduct: data
fileAssociations: [{"ext":"sqlite","mimeType":"application/vnd.sqlite3","name":"Auralis Nexus · .sqlite","role":"Editor"},{"ext":"sqlite3","mimeType":"application/vnd.sqlite3","name":"Auralis Nexus · .sqlite3","role":"Editor"},{"ext":"db","mimeType":"application/vnd.sqlite3","name":"Auralis Nexus · .db","role":"Editor"}]
files:
  - dist-data/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - file-formats.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/data-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Auralis-Nexus-${version}-Windows-Setup.exe
