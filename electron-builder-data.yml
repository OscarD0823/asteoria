appId: com.oscard.prismadata
productName: Asteoria Nexus
directories:
  output: release-data
extraMetadata:
  name: asteoria-data
  version: 1.0.1
  prismaProduct: data
files:
  - dist-data/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/data-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Asteoria-Nexus-${version}-Windows-Setup.exe
