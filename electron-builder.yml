appId: com.oscard.prismapdf
productName: Asteoria Folio
directories:
  output: release
extraMetadata:
  name: asteoria-pdf
  version: 7.0.2
  prismaProduct: pdf
fileAssociations: [{"ext":"pdf","mime":"application/pdf","name":"Asteoria Folio · .pdf","role":"Editor"},{"ext":"prisma","mime":"application/x-asteoria-folio","name":"Asteoria Folio · .prisma","role":"Editor"}]
files:
  - dist/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - file-formats.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Asteoria-Folio-${version}-Windows-Setup.exe
