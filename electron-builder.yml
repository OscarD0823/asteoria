appId: com.oscard.prismapdf
productName: Auralis Folio
directories:
  output: release
extraMetadata:
  name: asteoria-pdf
  version: 8.0.0
  prismaProduct: pdf
fileAssociations: [{"ext":"auralis","mimeType":"application/x-auralis-folio","name":"Auralis Folio · .auralis","role":"Editor"},{"ext":"pdf","mimeType":"application/pdf","name":"Auralis Folio · .pdf","role":"Editor"},{"ext":"prisma","mimeType":"application/x-asteoria-folio","name":"Auralis Folio · .prisma","role":"Editor"}]
files:
  - dist/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - file-formats.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Auralis-Folio-${version}-Windows-Setup.exe
