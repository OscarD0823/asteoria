appId: com.oscard.prismapdf
productName: Asteoria Folio
directories:
  output: release
extraMetadata:
  name: asteoria-pdf
  version: 7.0.0
  prismaProduct: pdf
files:
  - dist/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Asteoria-Folio-${version}-Windows-Setup.exe
