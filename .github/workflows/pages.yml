name: Publicar Prisma
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  product:
    uses: ./.github/workflows/product-pages.yml
    with:
      kind: prisma
