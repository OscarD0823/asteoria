name: Compilar y publicar una aplicación del entorno Auralis BETA
on:
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.sources.outputs.build }}
      root: ${{ steps.sources.outputs.root }}
      refs: ${{ steps.sources.outputs.refs }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: sources
        name: Comprobar cambios sin descargar dependencias
        env:
          GH_TOKEN: ${{ github.token }}
          PRISMA_KIND: ${{ inputs.kind }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const slugs={"pdf":"asteoria-folio","writer":"asteoria-scribe","sheets":"asteoria-orbit","slides":"asteoria-nova","data":"asteoria-nexus","publisher":"asteoria-canvas","architecture":"asteoria-atlas","stories":"asteoria-lore","prisma":"asteoria"}; const kinds=Object.keys(slugs);
          const kind=process.env.PRISMA_KIND;if(!kinds.includes(kind))throw Error('Programa inválido.');
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const sources=Object.fromEntries(await Promise.all(kinds.map(async k=>{
            const slug=slugs[k];
            const r=await fetch('https://api.github.com/repos/OscarD0823/'+slug+'/commits/main',{headers});
            if(!r.ok)throw Error('No se pudo consultar '+slug+': '+r.status);
            const {sha}=await r.json();if(!/^[a-f0-9]{40}$/.test(sha))throw Error('Commit inválido.');return[k,sha];
          })));
          let previous;try{const slug=process.env.GITHUB_REPOSITORY.split('/')[1];const r=await fetch('https://oscard0823.github.io/'+slug+'/workspace-build.json?check='+Date.now(),{cache:'no-store'});if(r.ok)previous=await r.json();}catch{}
          const dependencies=previous?.dependencies??kinds;
          const normalized=Object.fromEntries(dependencies.sort().map(k=>[k,sources[k]]));
          const hash=crypto.createHash('sha256').update(JSON.stringify(normalized)).digest('hex');
          const build=process.env.FORCE==='true'||!previous||previous.fingerprint!==hash;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'build='+build+'\nroot='+sources.prisma+'\nrefs='+JSON.stringify(sources)+'\n');
          console.log(build?'Hay código nuevo: se publicará '+kind:'Sin cambios en los módulos usados por '+kind+'.');
          JS
  build:
    if: needs.check.outputs.build == 'true'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: OscarD0823/auralis
          ref: ${{ needs.check.outputs.root }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Enlazar los ocho repositorios con commits concretos
        env:
          PRISMA_REFS: ${{ needs.check.outputs.refs }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync}from'node:child_process';
          const refs=JSON.parse(process.env.PRISMA_REFS),args=['scripts/workspace.mjs','sync'];
          for(const[kind,sha]of Object.entries(refs))if(kind!=='prisma')args.push('--ref',kind+'='+sha);
          const r=spawnSync(process.execPath,args,{stdio:'inherit'});if(r.status!==0)process.exit(r.status??1);
          JS
      - name: Instalar dependencias compartidas
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: node scripts/workspace.mjs validate
      - run: pnpm test
      - name: Compilar únicamente la aplicación solicitada
        run: pnpm build:product ${{ inputs.kind }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    if: needs.check.outputs.build == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
