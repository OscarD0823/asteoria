appId: com.oscard.prismaarquitectura
productName: Auralis Atlas
directories:
  output: release-architecture
extraMetadata:
  name: asteoria-architecture
  version: 0.4.0
  prismaProduct: architecture
fileAssociations: [{"ext":"auralis-atlas","mimeType":"application/x-auralis-atlas","name":"Auralis Atlas · .auralis-atlas","role":"Editor"},{"ext":"atlas","mimeType":"application/x-asteoria-atlas","name":"Auralis Atlas · .atlas","role":"Editor"},{"ext":"prisma-arquitectura","mimeType":"application/x-asteoria-atlas","name":"Auralis Atlas · .prisma-arquitectura","role":"Editor"}]
files:
  - dist-architecture/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - file-formats.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/architecture-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Auralis-Atlas-${version}-Windows-Setup.exe
