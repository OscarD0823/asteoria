appId: com.oscard.prismapublisher
productName: Auralis Canvas
directories:
  output: release-publisher
extraMetadata:
  name: asteoria-publisher
  version: 2.0.0
  prismaProduct: publisher
fileAssociations: [{"ext":"auralis-canvas","mimeType":"application/x-auralis-canvas","name":"Auralis Canvas · .auralis-canvas","role":"Editor"},{"ext":"prismapub","mimeType":"application/x-asteoria-canvas","name":"Auralis Canvas · .prismapub","role":"Editor"},{"ext":"pptx","mimeType":"application/vnd.openxmlformats-officedocument.presentationml.presentation","name":"Auralis Canvas · .pptx","role":"Editor"}]
files:
  - dist-publisher/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - file-formats.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/publisher-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Auralis-Canvas-${version}-Windows-Setup.exe
