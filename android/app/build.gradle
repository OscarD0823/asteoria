apply plugin: 'com.android.application'

android {
    buildFeatures { buildConfig true }
    namespace = "com.oscard.prismapdf"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.oscard.prismapdf"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 70002
        versionName "7.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions 'product'
    productFlavors {
        pdf {
            dimension 'product'
            applicationId 'com.oscard.prismapdf'
            versionCode 70002
            versionName '7.0.2'
            resValue 'string', 'app_name', 'Asteoria Folio'
            resValue 'string', 'title_activity_main', 'Asteoria Folio'
        }
        writer {
            dimension 'product'
            applicationId 'com.oscard.prismawriter'
            versionCode 20002
            versionName '2.0.2'
            resValue 'string', 'app_name', 'Asteoria Scribe'
            resValue 'string', 'title_activity_main', 'Asteoria Scribe'
        }
        sheets {
            dimension 'product'
            applicationId 'com.oscard.prismasheets'
            versionCode 10002
            versionName '1.0.2'
            resValue 'string', 'app_name', 'Asteoria Orbit'
            resValue 'string', 'title_activity_main', 'Asteoria Orbit'
        }
        slides {
            dimension 'product'
            applicationId 'com.oscard.prismaslides'
            versionCode 10002
            versionName '1.0.2'
            resValue 'string', 'app_name', 'Asteoria Nova'
            resValue 'string', 'title_activity_main', 'Asteoria Nova'
        }
        data {
            dimension 'product'
            applicationId 'com.oscard.prismadata'
            versionCode 10002
            versionName '1.0.2'
            resValue 'string', 'app_name', 'Asteoria Nexus'
            resValue 'string', 'title_activity_main', 'Asteoria Nexus'
        }
        publisher {
            dimension 'product'
            applicationId 'com.oscard.prismapublisher'
            versionCode 10002
            versionName '1.0.2'
            resValue 'string', 'app_name', 'Asteoria Canvas'
            resValue 'string', 'title_activity_main', 'Asteoria Canvas'
        }
        architecture {
            dimension 'product'
            applicationId 'com.oscard.prismaarquitectura'
            versionCode 302
            versionName '0.3.2'
            resValue 'string', 'app_name', 'Asteoria Atlas'
            resValue 'string', 'title_activity_main', 'Asteoria Atlas'
        }
        stories {
            dimension 'product'
            applicationId 'com.oscard.asteorialore'
            versionCode 10300
            versionName '1.3.0'
            resValue 'string', 'app_name', 'Asteoria Lore'
            resValue 'string', 'title_activity_main', 'Asteoria Lore'
        }
        prisma {
            dimension 'product'
            applicationId 'com.oscard.prisma'
            versionCode 20300
            versionName '2.3.0'
            resValue 'string', 'app_name', 'ASTEORIA'
            resValue 'string', 'title_activity_main', 'ASTEORIA'
        }
    }
    signingConfigs {
        release {
            if (System.getenv('PRISMA_KEYSTORE_FILE')) {
                storeFile file(System.getenv('PRISMA_KEYSTORE_FILE'))
                storePassword System.getenv('PRISMA_KEY_PASSWORD')
                keyAlias 'prisma-pdf'
                keyPassword System.getenv('PRISMA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('PRISMA_KEYSTORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

